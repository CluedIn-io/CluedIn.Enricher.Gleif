name: $(Date:yyyyMMdd)$(Rev:.r)
parameters:
  # Added 2026-09-11 - this parameter never existed before, so executeIntegrationTests silently
  # used the shared template's own `false` default with no toggle at all. Investigated whether it's
  # safe to turn on: the only active (non-[Skip]) test, TestCompanyWithInvalidLeiCode, "passes" but
  # is a silent no-op - confirmed via temporary debug probes on GleifExternalSearchProvider's
  # Accepts/BuildQueries (both implementing IConfigurableExternalSearchProvider) that neither is
  # ever invoked during the test. Same root cause as CluedIn.Enricher.VatLayer's migration (see its
  # docs/multi-version-targeting-migration.md Step 10) - BaseExternalSearchTest<T>-family harnesses
  # don't reliably invoke IConfigurableExternalSearchProvider's methods, so a "passing" test proves
  # nothing. Fixing this for real needs the same bespoke bypass-the-engine treatment VatLayer's
  # TestValidVATNumber got (a real, dedicated investigation, not a quick flag flip) - out of scope
  # here. Left at `false`; see docs/multi-version-targeting-migration.md for the full trace.
  - name: runIntegrationTests
    displayName: Run Integration Tests
    type: boolean
    default: false

  - name: pipelineTemplateRef
    displayName: Pipeline Template Ref
    type: string
    default: refs/heads/feature/multi-version-packaging

  # Manual, one-off check that this repo still builds and tests cleanly against a CluedIn.Core
  # version outside multiVersionCluedInTargets below - leave blank for a normal run.
  - name: probeCluedInVersion
    displayName: Probe CluedIn Version (leave blank for a normal run)
    type: string
    default: ''

trigger:
  branches:
    include:
    - develop
    - master
    - release/*

pr:
  branches:
    include:
    - develop
    - master
    - release/*

resources:
  repositories:
    - repository: templates
      type: github
      name: CluedIn-io/AzurePipelines.Templates
      endpoint: 'CluedIn-io'
      ref: ${{ parameters.pipelineTemplateRef }}

variables:
  - group: nuget
  - name: testFolderPath
    value: '$(Build.SourcesDirectory)/test'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true
  - name: buildConfiguration
    value: Release

# jobs:, not pool:/steps: - crawler.build.jobs.yml is a jobs template, the only one with
# multi-version support (crawler.build.yml has none).
jobs:
  - template: crawler.build.jobs.yml@templates
    parameters:
      pool:
        vmImage: 'ubuntu-22.04'
      githubReleaseInMaster: true
      publicReleaseForMaster: true
      publishCodeCoverage: true
      useGitVersionDotNetTool: true
      publishToDevFeed: true
      probeCluedInVersion: ${{ parameters.probeCluedInVersion }}
      executeIntegrationTests: ${{ parameters.runIntegrationTests }}
      multiVersionCluedInTargets:
        - cluedInVersion: '4.7.0'
        - cluedInVersion: '4.8.0'
        - cluedInVersion: '5.0.0-beta.*'
